name: Android CI - Build & Send APK to Telegram

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build_and_send:
    name: Build APKs & Send to Telegram
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Java
      # ─────────────────────────────────────────────
      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ─────────────────────────────────────────────
      # Gradle Wrapper
      # ─────────────────────────────────────────────
      - name: ⚙️ Ensure Gradle Wrapper Exists
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found. Generating wrapper..."
            gradle wrapper --gradle-version 8.11.1
          fi

          chmod +x ./gradlew

      # ─────────────────────────────────────────────
      # Setup Keystore and Properties
      # ─────────────────────────────────────────────
      - name: 🔐 Setup Keystore and Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            chmod 600 /tmp/release.keystore
            echo "✅ Release keystore created."
          else
            echo "ℹ️ KEYSTORE_BASE64 is not configured."
          fi

          if [ -n "${KEYSTORE_PROPERTIES:-}" ]; then
            printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties
            chmod 600 keystore.properties
            echo "✅ keystore.properties created."
          else
            echo "ℹ️ KEYSTORE_PROPERTIES is not configured."
          fi

      # ─────────────────────────────────────────────
      # Build Debug & Release APKs
      # ─────────────────────────────────────────────
      - name: 🔨 Build APKs
        id: build
        continue-on-error: true
        run: |
          set -o pipefail

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔨 Building Debug & Release APKs"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo "exit_code=$BUILD_EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit "$BUILD_EXIT_CODE"

      # ─────────────────────────────────────────────
      # Extract Build Error
      # ─────────────────────────────────────────────
      - name: 🧩 Extract Build Error
        if: steps.build.outcome == 'failure'
        id: error
        run: |
          set -euo pipefail

          if [ -f build.log ]; then

            ERROR_TEXT=$(
              grep -E \
                "FAILURE:|What went wrong:|Execution failed|Caused by:|error:|e: |Could not|Unresolved reference|Exception" \
                build.log \
                | tail -n 25 \
                || true
            )

            if [ -z "$ERROR_TEXT" ]; then
              ERROR_TEXT=$(tail -n 40 build.log)
            fi

          else
            ERROR_TEXT="Build failed, but no build log was generated."
          fi

          # Telegram message limit protection.
          ERROR_TEXT=$(printf '%s' "$ERROR_TEXT" | tail -c 3000)

          {
            echo 'error<<EOF'
            echo "$ERROR_TEXT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────
      # Locate APKs
      # ─────────────────────────────────────────────
      - name: 🔎 Locate Built APKs
        id: find_apk
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail

          DEBUG_APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔎 Checking generated APKs"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo ""
          echo "📂 All generated APK files:"
          find "$GITHUB_WORKSPACE/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print || true

          # ─────────────────────────────────────────
          # Debug APK
          # ─────────────────────────────────────────

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Checking Debug APK"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "Path:"
          echo "$DEBUG_APK_PATH"

          if [ ! -f "$DEBUG_APK_PATH" ]; then
            echo "::error::Debug APK does not exist:"
            echo "$DEBUG_APK_PATH"

            echo ""
            echo "Contents of app/build/outputs:"
            find "$GITHUB_WORKSPACE/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          if [ ! -r "$DEBUG_APK_PATH" ]; then
            echo "::error::Debug APK is not readable."
            exit 1
          fi

          if [ ! -s "$DEBUG_APK_PATH" ]; then
            echo "::error::Debug APK is empty."
            exit 1
          fi

          echo "✅ Debug APK exists and is readable."
          ls -lh "$DEBUG_APK_PATH"

          # ─────────────────────────────────────────
          # Release APK
          # ─────────────────────────────────────────

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Checking Release APK"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "Path:"
          echo "$RELEASE_APK_PATH"

          if [ ! -f "$RELEASE_APK_PATH" ]; then
            echo "::error::Release APK does not exist:"
            echo "$RELEASE_APK_PATH"

            echo ""
            echo "Contents of app/build/outputs:"
            find "$GITHUB_WORKSPACE/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          if [ ! -r "$RELEASE_APK_PATH" ]; then
            echo "::error::Release APK is not readable."
            exit 1
          fi

          if [ ! -s "$RELEASE_APK_PATH" ]; then
            echo "::error::Release APK is empty."
            exit 1
          fi

          echo "✅ Release APK exists and is readable."
          ls -lh "$RELEASE_APK_PATH"

          # ─────────────────────────────────────────
          # Export paths
          # ─────────────────────────────────────────

          echo "debug_apk_path=$DEBUG_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "release_apk_path=$RELEASE_APK_PATH" >> "$GITHUB_OUTPUT"

          echo ""
          echo "✅ APK validation completed successfully."

      # ─────────────────────────────────────────────
      # Send Successful Builds to Telegram
      # ─────────────────────────────────────────────
      - name: 📲 Send Successful Builds to Telegram
        if: steps.build.outcome == 'success' && steps.find_apk.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          DEBUG_APK_FILE: ${{ steps.find_apk.outputs.debug_apk_path }}
          RELEASE_APK_FILE: ${{ steps.find_apk.outputs.release_apk_path }}

        run: |
          set -euo pipefail

          # ─────────────────────────────────────────
          # Validate Telegram secrets
          # ─────────────────────────────────────────

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is missing."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_CHAT_ID secret is missing."
            exit 1
          fi

          # ─────────────────────────────────────────
          # Validate APK paths
          # ─────────────────────────────────────────

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 APK FILES"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo ""
          echo "Debug APK:"
          echo "$DEBUG_APK_FILE"

          echo ""
          echo "Release APK:"
          echo "$RELEASE_APK_FILE"

          if [ ! -f "$DEBUG_APK_FILE" ]; then
            echo "::error::Debug APK does not exist."
            exit 1
          fi

          if [ ! -r "$DEBUG_APK_FILE" ]; then
            echo "::error::Debug APK is not readable."
            exit 1
          fi

          if [ ! -s "$DEBUG_APK_FILE" ]; then
            echo "::error::Debug APK is empty."
            exit 1
          fi

          if [ ! -f "$RELEASE_APK_FILE" ]; then
            echo "::error::Release APK does not exist."
            exit 1
          fi

          if [ ! -r "$RELEASE_APK_FILE" ]; then
            echo "::error::Release APK is not readable."
            exit 1
          fi

          if [ ! -s "$RELEASE_APK_FILE" ]; then
            echo "::error::Release APK is empty."
            exit 1
          fi

          echo ""
          echo "Debug APK:"
          ls -lh "$DEBUG_APK_FILE"

          echo ""
          echo "Release APK:"
          ls -lh "$RELEASE_APK_FILE"

          # ─────────────────────────────────────────
          # Extra file test
          # ─────────────────────────────────────────

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧪 Testing APK file access"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          stat "$DEBUG_APK_FILE"
          stat "$RELEASE_APK_FILE"

          echo "✅ APK files can be accessed by curl."

          # ─────────────────────────────────────────
          # GitHub Information
          # ─────────────────────────────────────────

          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_NUMBER="${{ github.run_number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMIT_MSG=$(git log -1 --pretty=%s)

          # ─────────────────────────────────────────
          # Escape HTML
          # ─────────────────────────────────────────

          escape_html() {
            printf '%s' "$1" |
              sed \
                -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g'
          }

          SAFE_REPO=$(escape_html "$REPO_NAME")
          SAFE_BRANCH=$(escape_html "$BRANCH_NAME")
          SAFE_COMMIT=$(escape_html "$SHORT_SHA")
          SAFE_MESSAGE=$(escape_html "$COMMIT_MSG")

          # ─────────────────────────────────────────
          # Debug Caption
          # ─────────────────────────────────────────

          DEBUG_CAPTION="<b>🎮 WALL WAR</b>

          ━━━━━━━━━━━━━━━━━━━━
          <b>🟢 BUILD SUCCESSFUL</b>
          ━━━━━━━━━━━━━━━━━━━━

          📦 <b>Build</b>
          └ <code>Debug APK</code>

          🌿 <b>Branch</b>
          └ <code>${SAFE_BRANCH}</code>

          🔖 <b>Commit</b>
          └ <code>${SAFE_COMMIT}</code>

          📝 <b>Changes</b>
          └ ${SAFE_MESSAGE}

          🔢 <b>Build #${RUN_NUMBER}</b>

          ━━━━━━━━━━━━━━━━━━━━
          📱 <b>Debug APK is ready!</b>

          🔗 <a href=\"${RUN_URL}\">View GitHub Actions</a>"

          # ─────────────────────────────────────────
          # Release Caption
          # ─────────────────────────────────────────

          RELEASE_CAPTION="<b>🎮 WALL WAR</b>

          ━━━━━━━━━━━━━━━━━━━━
          <b>🚀 RELEASE READY</b>
          ━━━━━━━━━━━━━━━━━━━━

          📦 <b>Build</b>
          └ <code>Release APK • Signed</code>

          🌿 <b>Branch</b>
          └ <code>${SAFE_BRANCH}</code>

          🔖 <b>Commit</b>
          └ <code>${SAFE_COMMIT}</code>

          📝 <b>Changes</b>
          └ ${SAFE_MESSAGE}

          🔢 <b>Build #${RUN_NUMBER}</b>

          ━━━━━━━━━━━━━━━━━━━━
          📱 <b>Release APK is ready!</b>
          🔐 <i>Signed &amp; production-ready</i>

          🔗 <a href=\"${RUN_URL}\">View GitHub Actions</a>"

          # ─────────────────────────────────────────
          # Upload Debug APK
          # ─────────────────────────────────────────

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📤 Uploading Debug APK to Telegram..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${DEBUG_APK_FILE}" \
            --form-string "caption=${DEBUG_CAPTION}" \
            --form-string "parse_mode=HTML" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

          echo ""
          echo "✅ Debug APK uploaded successfully."

          # ─────────────────────────────────────────
          # Upload Release APK
          # ─────────────────────────────────────────

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📤 Uploading Release APK to Telegram..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${RELEASE_APK_FILE}" \
            --form-string "caption=${RELEASE_CAPTION}" \
            --form-string "parse_mode=HTML" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

          echo ""
          echo "✅ Release APK uploaded successfully."

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 ALL APKs SENT TO TELEGRAM"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ─────────────────────────────────────────────
      # Send Build Failure to Telegram
      # ─────────────────────────────────────────────
      - name: 🚨 Send Build Failure to Telegram
        if: steps.build.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_ERROR: ${{ steps.error.outputs.error }}

        run: |
          set -euo pipefail

          # ─────────────────────────────────────────
          # Validate Telegram secrets
          # ─────────────────────────────────────────

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is missing."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_CHAT_ID secret is missing."
            exit 1
          fi

          # ─────────────────────────────────────────
          # GitHub Information
          # ─────────────────────────────────────────

          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_NUMBER="${{ github.run_number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMIT_MSG=$(git log -1 --pretty=%s)

          # ─────────────────────────────────────────
          # Escape HTML
          # ─────────────────────────────────────────

          escape_html() {
            printf '%s' "$1" |
              sed \
                -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g'
          }

          SAFE_REPO=$(escape_html "$REPO_NAME")
          SAFE_BRANCH=$(escape_html "$BRANCH_NAME")
          SAFE_COMMIT=$(escape_html "$SHORT_SHA")
          SAFE_MESSAGE=$(escape_html "$COMMIT_MSG")
          SAFE_ERROR=$(escape_html "$BUILD_ERROR")

          # ─────────────────────────────────────────
          # Failure Message
          # ─────────────────────────────────────────

          MESSAGE="<b>🎮 WALL WAR</b>

          ━━━━━━━━━━━━━━━━━━━━
          <b>🔴 BUILD FAILED</b>
          ━━━━━━━━━━━━━━━━━━━━

          ⚠️ <b>Something went wrong.</b>
          The Android build could not be completed.

          📦 <b>Repository</b>
          └ <code>${SAFE_REPO}</code>

          🌿 <b>Branch</b>
          └ <code>${SAFE_BRANCH}</code>

          🔖 <b>Commit</b>
          └ <code>${SAFE_COMMIT}</code>

          📝 <b>Changes</b>
          └ ${SAFE_MESSAGE}

          🔢 <b>Build #${RUN_NUMBER}</b>

          ━━━━━━━━━━━━━━━━━━━━
          ❌ <b>Error Details</b>

          <pre>${SAFE_ERROR}</pre>

          ━━━━━━━━━━━━━━━━━━━━
          🔍 <a href=\"${RUN_URL}\">Open Full Build Log</a>"

          # ─────────────────────────────────────────
          # Send Telegram Failure Notification
          # ─────────────────────────────────────────

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚨 Sending build failure notification..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML"

          echo ""
          echo "✅ Failure notification sent to Telegram."

      # ─────────────────────────────────────────────
      # Clean Keystore Files
      # ─────────────────────────────────────────────
      - name: 🧹 Clean Keystore Files
        if: always()
        run: |
          rm -f /tmp/release.keystore
          rm -f keystore.properties

      # ─────────────────────────────────────────────
      # Fail Workflow if Build Failed
      # ─────────────────────────────────────────────
      - name: ❌ Fail Workflow if Build Failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "❌ Gradle build failed."
          exit 1