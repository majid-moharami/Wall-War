name: Android CI - Build & Send APK to Telegram

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build_and_send:
    name: Build APKs & Send to Telegram
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Java
      # ─────────────────────────────────────────────
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ─────────────────────────────────────────────
      # Gradle Wrapper
      # ─────────────────────────────────────────────
      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.11.1
          fi

          chmod +x gradlew

      # ─────────────────────────────────────────────
      # Setup Keystore and Properties
      # ─────────────────────────────────────────────
      - name: Setup Keystore and Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          fi
          if [ -n "$KEYSTORE_PROPERTIES" ]; then
            echo "$KEYSTORE_PROPERTIES" > keystore.properties
          fi

      # ─────────────────────────────────────────────
      # Build Debug & Release APKs
      # ─────────────────────────────────────────────
      - name: Build APKs
        id: build
        continue-on-error: true
        run: |
          set -o pipefail

          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo "exit_code=$BUILD_EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit $BUILD_EXIT_CODE

      # ─────────────────────────────────────────────
      # Extract Build Error
      # ─────────────────────────────────────────────
      - name: Extract Build Error
        if: steps.build.outcome == 'failure'
        id: error
        run: |
          if [ -f build.log ]; then

            # Try to find the most useful Gradle error lines.
            ERROR_TEXT=$(grep -E \
              "FAILURE:|What went wrong:|Execution failed|Caused by:|error:|e: |Could not|Unresolved reference|Exception" \
              build.log \
              | tail -n 25)

            if [ -z "$ERROR_TEXT" ]; then
              ERROR_TEXT=$(tail -n 40 build.log)
            fi

          else
            ERROR_TEXT="Build failed, but no build log was generated."
          fi

          # Limit message size so Telegram doesn't reject it.
          ERROR_TEXT=$(echo "$ERROR_TEXT" | tail -c 3500)

          {
            echo 'error<<EOF'
            echo "$ERROR_TEXT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────
      # Find APKs
      # ─────────────────────────────────────────────
      - name: Locate Built APKs
        id: find_apk
        if: steps.build.outcome == 'success'
        run: |
          DEBUG_APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$DEBUG_APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/debug/"
            exit 1
          fi

          RELEASE_APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/release/"
            exit 1
          fi

          echo "debug_apk_path=$DEBUG_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "release_apk_path=$RELEASE_APK_PATH" >> "$GITHUB_OUTPUT"

          echo "Found Debug APK: $DEBUG_APK_PATH"
          echo "Found Release APK: $RELEASE_APK_PATH"

      # ─────────────────────────────────────────────
      # Send Successful Builds to Telegram
      # ─────────────────────────────────────────────
      - name: Send Successful Builds to Telegram
        if: steps.build.outcome == 'success' && steps.find_apk.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Missing Telegram secrets."
            exit 1
          fi

          DEBUG_APK_FILE="${{ steps.find_apk.outputs.debug_apk_path }}"
          RELEASE_APK_FILE="${{ steps.find_apk.outputs.release_apk_path }}"

          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_NUMBER="${{ github.run_number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMIT_MSG=$(git log -1 --pretty=%s)

          CAPTION_DEBUG="🎮 <b>Wall War — New Build</b>

🟢 <b>BUILD SUCCESS</b>

📦 <b>APK:</b> <code>Debug</code>
🌿 <b>Branch:</b> <code>${BRANCH_NAME}</code>
🔖 <b>Commit:</b> <code>${SHORT_SHA}</code>
📝 <b>Message:</b> ${COMMIT_MSG}

🔢 <b>Build:</b> #${RUN_NUMBER}

─────────────────
📲 <b>Debug APK is ready!</b>
🔗 <a href=\"${RUN_URL}\">View GitHub Actions</a>"

          CAPTION_RELEASE="🎮 <b>Wall War — New Build</b>

🟢 <b>BUILD SUCCESS</b>

📦 <b>APK:</b> <code>Release (Signed)</code>
🌿 <b>Branch:</b> <code>${BRANCH_NAME}</code>
🔖 <b>Commit:</b> <code>${SHORT_SHA}</code>
📝 <b>Message:</b> ${COMMIT_MSG}

🔢 <b>Build:</b> #${RUN_NUMBER}

─────────────────
📲 <b>Release APK is ready!</b>
🔗 <a href=\"${RUN_URL}\">View GitHub Actions</a>"

          echo "Uploading Debug APK to Telegram..."
          curl --fail-with-body -s \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${DEBUG_APK_FILE}" \
            -F caption="${CAPTION_DEBUG}" \
            -F parse_mode="HTML" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

          echo "Uploading Release APK to Telegram..."
          curl --fail-with-body -s \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${RELEASE_APK_FILE}" \
            -F caption="${CAPTION_RELEASE}" \
            -F parse_mode="HTML" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

      # ─────────────────────────────────────────────
      # Send Build Failure to Telegram
      # ─────────────────────────────────────────────
      - name: Send Build Failure to Telegram
        if: steps.build.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_ERROR: ${{ steps.error.outputs.error }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Missing Telegram secrets."
            exit 1
          fi

          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_NUMBER="${{ github.run_number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMIT_MSG=$(git log -1 --pretty=%s)

          MESSAGE="🚨 <b>Wall War — Build Failed</b>

🔴 <b>BUILD FAILED</b>

📦 <b>Repository:</b> <code>${REPO_NAME}</code>
🌿 <b>Branch:</b> <code>${BRANCH_NAME}</code>
🔖 <b>Commit:</b> <code>${SHORT_SHA}</code>
📝 <b>Message:</b> ${COMMIT_MSG}

🔢 <b>Build:</b> #${RUN_NUMBER}

─────────────────
❌ <b>Error:</b>

<pre>${BUILD_ERROR}</pre>

🔗 <a href=\"${RUN_URL}\">View Full GitHub Actions Log</a>"

          echo "Sending build failure notification to Telegram..."

          curl --fail-with-body -s \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" \
            -d parse_mode="HTML"

      # ─────────────────────────────────────────────
      # Clean Keystore Files
      # ─────────────────────────────────────────────
      - name: Clean Keystore Files
        if: always()
        run: |
          rm -f /tmp/release.keystore
          rm -f keystore.properties

      # ─────────────────────────────────────────────
      # Fail Workflow if Build Failed
      # ─────────────────────────────────────────────
      - name: Fail Workflow if Build Failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "❌ Gradle build failed."
          exit 1