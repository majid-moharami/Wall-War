name: Android CI - Build & Send APK to Telegram

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build_and_send:
    name: Build APKs & Send to Telegram
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Java
      # ─────────────────────────────────────────────
      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ─────────────────────────────────────────────
      # Gradle Wrapper
      # ─────────────────────────────────────────────
      - name: ⚙️ Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.11.1
          fi

          chmod +x gradlew

      # ─────────────────────────────────────────────
      # Setup Keystore and Properties
      # ─────────────────────────────────────────────
      - name: 🔐 Setup Keystore and Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          fi

          if [ -n "$KEYSTORE_PROPERTIES" ]; then
            echo "$KEYSTORE_PROPERTIES" > keystore.properties
          fi

      # ─────────────────────────────────────────────
      # Build Debug & Release APKs
      # ─────────────────────────────────────────────
      - name: 🔨 Build APKs
        id: build
        continue-on-error: true
        run: |
          set -o pipefail

          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo "exit_code=$BUILD_EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit $BUILD_EXIT_CODE

      # ─────────────────────────────────────────────
      # Extract Build Error
      # ─────────────────────────────────────────────
      - name: 🧩 Extract Build Error
        if: steps.build.outcome == 'failure'
        id: error
        run: |
          if [ -f build.log ]; then

            ERROR_TEXT=$(grep -E \
              "FAILURE:|What went wrong:|Execution failed|Caused by:|error:|e: |Could not|Unresolved reference|Exception" \
              build.log \
              | tail -n 25)

            if [ -z "$ERROR_TEXT" ]; then
              ERROR_TEXT=$(tail -n 40 build.log)
            fi

          else
            ERROR_TEXT="Build failed, but no build log was generated."
          fi

          ERROR_TEXT=$(echo "$ERROR_TEXT" | tail -c 3500)

          {
            echo 'error<<EOF'
            echo "$ERROR_TEXT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────
      # Find APKs
      # ─────────────────────────────────────────────
      - name: 🔎 Locate Built APKs
        id: find_apk
        if: steps.build.outcome == 'success'
        run: |
          DEBUG_APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)

          if [ -z "$DEBUG_APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/debug/"
            exit 1
          fi

          RELEASE_APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          if [ -z "$RELEASE_APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/release/"
            exit 1
          fi

          echo "debug_apk_path=$DEBUG_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "release_apk_path=$RELEASE_APK_PATH" >> "$GITHUB_OUTPUT"

          echo "Found Debug APK: $DEBUG_APK_PATH"
          echo "Found Release APK: $RELEASE_APK_PATH"

      # ─────────────────────────────────────────────
      # Send Successful Builds to Telegram
      # ─────────────────────────────────────────────
      - name: 📲 Send Successful Builds to Telegram
        if: steps.build.outcome == 'success' && steps.find_apk.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Missing Telegram secrets."
            exit 1
          fi

          DEBUG_APK_FILE="${{ steps.find_apk.outputs.debug_apk_path }}"
          RELEASE_APK_FILE="${{ steps.find_apk.outputs.release_apk_path }}"

          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_NUMBER="${{ github.run_number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMIT_MSG=$(git log -1 --pretty=%s)

          # Escape values for Telegram HTML.
          escape_html() {
            printf '%s' "$1" \
              | sed \
                  -e 's/&/\&amp;/g' \
                  -e 's/</\&lt;/g' \
                  -e 's/>/\&gt;/g'
          }

          SAFE_REPO=$(escape_html "$REPO_NAME")
          SAFE_BRANCH=$(escape_html "$BRANCH_NAME")
          SAFE_COMMIT=$(escape_html "$SHORT_SHA")
          SAFE_MESSAGE=$(escape_html "$COMMIT_MSG")

          DEBUG_CAPTION="<b>🎮 WALL WAR</b>

          ━━━━━━━━━━━━━━━━━━━━
          <b>🟢 BUILD SUCCESSFUL</b>
          ━━━━━━━━━━━━━━━━━━━━

          📦 <b>Build</b>
          └ <code>Debug APK</code>

          🌿 <b>Branch</b>
          └ <code>${SAFE_BRANCH}</code>

          🔖 <b>Commit</b>
          └ <code>${SAFE_COMMIT}</code>

          📝 <b>Changes</b>
          └ ${SAFE_MESSAGE}

          🔢 <b>Build #${RUN_NUMBER}</b>

          ━━━━━━━━━━━━━━━━━━━━
          📱 <b>Debug APK is ready!</b>

          🔗 <a href=\"${RUN_URL}\">View GitHub Actions</a>"

          RELEASE_CAPTION="<b>🎮 WALL WAR</b>

          ━━━━━━━━━━━━━━━━━━━━
          <b>🚀 RELEASE READY</b>
          ━━━━━━━━━━━━━━━━━━━━

          📦 <b>Build</b>
          └ <code>Release APK • Signed</code>

          🌿 <b>Branch</b>
          └ <code>${SAFE_BRANCH}</code>

          🔖 <b>Commit</b>
          └ <code>${SAFE_COMMIT}</code>

          📝 <b>Changes</b>
          └ ${SAFE_MESSAGE}

          🔢 <b>Build #${RUN_NUMBER}</b>

          ━━━━━━━━━━━━━━━━━━━━
          📱 <b>Release APK is ready!</b>
          🔐 <i>Signed & production-ready</i>

          🔗 <a href=\"${RUN_URL}\">View GitHub Actions</a>"

          echo "Uploading Debug APK to Telegram..."

          curl --fail-with-body -s \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${DEBUG_APK_FILE}" \
            -F caption="${DEBUG_CAPTION}" \
            -F parse_mode="HTML" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

          echo "Uploading Release APK to Telegram..."

          curl --fail-with-body -s \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${RELEASE_APK_FILE}" \
            -F caption="${RELEASE_CAPTION}" \
            -F parse_mode="HTML" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

      # ─────────────────────────────────────────────
      # Send Build Failure to Telegram
      # ─────────────────────────────────────────────
      - name: 🚨 Send Build Failure to Telegram
        if: steps.build.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_ERROR: ${{ steps.error.outputs.error }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Missing Telegram secrets."
            exit 1
          fi

          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_NUMBER="${{ github.run_number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMIT_MSG=$(git log -1 --pretty=%s)

          # Escape values for Telegram HTML.
          escape_html() {
            printf '%s' "$1" \
              | sed \
                  -e 's/&/\&amp;/g' \
                  -e 's/</\&lt;/g' \
                  -e 's/>/\&gt;/g'
          }

          SAFE_REPO=$(escape_html "$REPO_NAME")
          SAFE_BRANCH=$(escape_html "$BRANCH_NAME")
          SAFE_COMMIT=$(escape_html "$SHORT_SHA")
          SAFE_MESSAGE=$(escape_html "$COMMIT_MSG")
          SAFE_ERROR=$(escape_html "$BUILD_ERROR")

          MESSAGE="<b>🎮 WALL WAR</b>

          ━━━━━━━━━━━━━━━━━━━━
          <b>🔴 BUILD FAILED</b>
          ━━━━━━━━━━━━━━━━━━━━

          ⚠️ <b>Something went wrong.</b>
          The Android build could not be completed.

          📦 <b>Repository</b>
          └ <code>${SAFE_REPO}</code>

          🌿 <b>Branch</b>
          └ <code>${SAFE_BRANCH}</code>

          🔖 <b>Commit</b>
          └ <code>${SAFE_COMMIT}</code>

          📝 <b>Changes</b>
          └ ${SAFE_MESSAGE}

          🔢 <b>Build #${RUN_NUMBER}</b>

          ━━━━━━━━━━━━━━━━━━━━
          ❌ <b>Error Details</b>

          <pre>${SAFE_ERROR}</pre>

          ━━━━━━━━━━━━━━━━━━━━
          🔍 <a href=\"${RUN_URL}\">Open Full Build Log</a>"

          echo "Sending build failure notification to Telegram..."

          curl --fail-with-body -s \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" \
            -d parse_mode="HTML"

      # ─────────────────────────────────────────────
      # Clean Keystore Files
      # ─────────────────────────────────────────────
      - name: 🧹 Clean Keystore Files
        if: always()
        run: |
          rm -f /tmp/release.keystore
          rm -f keystore.properties

      # ─────────────────────────────────────────────
      # Fail Workflow if Build Failed
      # ─────────────────────────────────────────────
      - name: ❌ Fail Workflow if Build Failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "❌ Gradle build failed."
          exit 1
